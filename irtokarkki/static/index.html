<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irtokarkki</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g transform='rotate(45 8.5 18.5)'><rect x='3' y='13' width='11' height='11' rx='2.5' fill='%232A1630'/></g><circle cx='20.5' cy='11' r='6' fill='none' stroke='%23D91A5B' stroke-width='4'/><ellipse cx='22' cy='24' rx='5' ry='3.6' fill='%23FFD84A' transform='rotate(-20 22 24)'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Sugar-white paper, liquorice-plum ink, raspberry for actions, lemon for sale tags. */
  :root {
    --paper: #f6f2f7;
    --surface: #ffffff;
    --surface-2: #efe8f0;
    --ink: #2a1630;
    --muted: #74627a;
    --rule: #e4dae6;
    --leader: #c9bacd;
    --raspberry: #d91a5b;
    --on-raspberry: #ffffff;
    --raspberry-soft: #fbe4ed;
    --lemon: #ffd84a;
    --on-lemon: #2a1630;
    --s-group: #0b7a3e;
    --on-mark: #ffffff;
    --lift: 0 1px 0 rgba(42, 22, 48, .04), 0 18px 40px -22px rgba(42, 22, 48, .35);
    --display: "Unbounded", "Segoe UI", system-ui, sans-serif;
    --text: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1b1020;
      --surface: #251729;
      --surface-2: #322336;
      --ink: #f5edf6;
      --muted: #b5a4ba;
      --rule: #3b2b40;
      --leader: #5a4660;
      --raspberry: #ff5288;
      --on-raspberry: #1b1020;
      --raspberry-soft: #42192d;
      --s-group: #43c47f;
      --on-mark: #1b1020;
      --lift: none;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 16px/1.5 var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .now, .pprice, .count { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 18px 20px 120px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--raspberry); outline-offset: 2px; }
  [hidden] { display: none !important; }
  svg.icon { width: 1em; height: 1em; flex: none; }

  /* Top bar */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .wordmark { font: 600 19px/1 var(--display); letter-spacing: -.02em; }
  .logo { width: 32px; height: 32px; overflow: visible; }
  .logo g { transform-box: fill-box; transform-origin: center; animation: drop .6s cubic-bezier(.3, 1.5, .5, 1) backwards; }
  .logo g:nth-child(2) { animation-delay: .08s; }
  .logo g:nth-child(3) { animation-delay: .16s; }
  .logo.busy g { animation: bob 1s ease-in-out infinite; }
  .logo.busy g:nth-child(2) { animation-delay: .15s; }
  .logo.busy g:nth-child(3) { animation-delay: .3s; }
  @keyframes drop { from { transform: translateY(-16px); opacity: 0; } }
  @keyframes bob { 50% { transform: translateY(-4px); } }

  .lang { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface-2); }
  .lang button {
    border: none; background: none; border-radius: 999px; padding: 6px 11px;
    font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted);
  }
  .lang button:hover { color: var(--ink); }
  .lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(42, 22, 48, .14); }

  /* Hero: the answer to "is anything I buy on sale?" */
  .hero { margin: 64px 0 0; }
  h1 {
    margin: 0; max-width: 12ch;
    font: 600 clamp(36px, 8vw, 60px)/1.02 var(--display); letter-spacing: -.035em;
    text-wrap: balance;
  }
  .status { margin: 16px 0 0; min-height: 24px; color: var(--muted); font-size: 16px; }

  .field {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 999px;
    padding: 6px 6px 6px 18px; box-shadow: var(--lift);
  }
  .field:focus-within { border-color: var(--raspberry); box-shadow: 0 0 0 3px var(--raspberry-soft), var(--lift); }
  .field .icon { color: var(--muted); font-size: 18px; }
  .field input {
    flex: 1; min-width: 0; border: none; outline: none; background: none; color: var(--ink);
    font: 500 16px var(--text); padding: 11px 4px;
  }
  .field input::placeholder { color: var(--muted); font-weight: 400; }
  .primary {
    flex: none; border: none; border-radius: 999px; padding: 12px 22px;
    background: var(--raspberry); color: var(--on-raspberry); font-weight: 700; font-size: 15px;
    transition: transform .12s ease, filter .12s ease;
  }
  .primary:hover { filter: brightness(1.06); }
  .primary:active { transform: scale(.97); }
  .primary:disabled { opacity: .55; cursor: default; filter: none; transform: none; }

  .error {
    margin: 20px 0 0; padding: 12px 16px; border-radius: 14px;
    background: var(--raspberry-soft); color: var(--ink); font-size: 15px;
  }

  /* Tabs */
  .tabs { display: flex; gap: 28px; margin: 56px 0 22px; border-bottom: 1px solid var(--rule); }
  .tab {
    position: relative; display: inline-flex; align-items: center; gap: 8px;
    border: none; background: none; padding: 12px 0 14px;
    font-weight: 650; font-size: 16px; color: var(--muted);
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); }
  .tab.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px;
    border-radius: 3px 3px 0 0; background: var(--raspberry);
  }
  .count {
    display: inline-flex; align-items: center; gap: 3px; min-width: 26px; justify-content: center;
    padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink);
    font: 500 12px/1.2 var(--display);
  }
  .count .icon { font-size: 11px; }

  .filters { margin: 0 0 24px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--rule); background: none; border-radius: 999px; padding: 7px 14px;
    font-size: 14px; font-weight: 600;
  }
  .chip:hover { border-color: var(--muted); }
  .chip .icon { font-size: 15px; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .chip.on .icon { fill: currentColor; }

  /* Stores */
  .store-head { display: flex; align-items: center; gap: 14px; }
  .mark {
    flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
    font: 600 14px/1 var(--display); color: var(--on-mark);
  }
  .mark.s_group { background: var(--s-group); }
  .store-info { flex: 1; min-width: 0; }
  .store-name { margin: 0; font-size: 17px; font-weight: 650; line-height: 1.3; }
  .store-loc { color: var(--muted); font-size: 14px; margin-top: 1px; }
  .store-loc a { display: inline-flex; align-items: center; gap: 4px; color: inherit; text-decoration: none; }
  .store-loc a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .store-loc .icon { font-size: 13px; }

  .star {
    flex: none; display: grid; place-items: center; width: 40px; height: 40px;
    border: none; background: none; border-radius: 50%; color: var(--muted);
  }
  .star .icon { font-size: 22px; }
  .star:hover { background: var(--surface-2); color: var(--ink); }
  .star.on { color: var(--raspberry); }
  .star.on .icon { fill: currentColor; }

  /* Stores with a discount: raised, with a lemon price tag per deal. */
  .store.featured {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 24px;
    padding: 18px 22px 8px; margin-bottom: 18px; box-shadow: var(--lift);
  }
  .store-body { margin-left: 48px; }
  .deal {
    display: flex; align-items: center; justify-content: space-between; gap: 18px;
    padding: 22px 0 16px; border-top: 1px solid var(--rule);
  }
  .store-head + .store-body .deal:first-child { margin-top: 12px; }
  .deal-name { font-weight: 600; font-size: 16px; }
  .deal-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 4px; color: var(--muted); font-size: 14px; }

  .price-tag { position: relative; flex: none; margin-right: 10px; }
  .tag {
    display: grid; justify-items: start; min-width: 108px; padding: 9px 18px 9px 30px; background: var(--lemon); color: var(--on-lemon);
    clip-path: polygon(16px 0, 100% 0, 100% 100%, 16px 100%, 0 50%);
    border-radius: 0 10px 10px 0;
  }
  .tag::before {
    content: ""; position: absolute; left: 12px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px;
    border-radius: 50%; background: var(--surface);
  }
  .was { font-size: 13px; text-decoration: line-through; opacity: .7; }
  .now { font: 600 22px/1.15 var(--display); letter-spacing: -.03em; }
  .off {
    position: absolute; top: -14px; right: -12px; display: grid; place-items: center;
    width: 44px; height: 44px; border-radius: 50%; transform: rotate(10deg);
    background: var(--raspberry); color: var(--on-raspberry); font: 600 11px/1 var(--display); letter-spacing: -.02em;
  }

  /* Regular prices: a price board with dotted leaders. */
  .price-list { list-style: none; margin: 0; padding: 4px 0 10px; }
  .deal + .price-list, .deal ~ .price-list { border-top: 1px solid var(--rule); padding-top: 10px; }
  .price-row { display: flex; align-items: baseline; align-items: last baseline; padding: 7px 0; font-size: 15px; }
  .pname { flex: 0 1 auto; min-width: 0; }
  .leader { flex: 1 1 20px; min-width: 20px; margin: 0 10px; border-bottom: 2px dotted var(--leader); transform: translateY(-4px); }
  .pprice { flex: none; font: 500 15px/1.2 var(--display); letter-spacing: -.02em; }

  h2 {
    display: flex; align-items: baseline; gap: 10px;
    margin: 56px 0 6px; font: 500 19px/1.3 var(--display); letter-spacing: -.02em;
  }
  h2 .h-count { font: 500 15px var(--text); color: var(--muted); letter-spacing: 0; }
  .store.plain { padding: 18px 0 6px; border-top: 1px solid var(--rule); }
  h2 + .store.plain { border-top: none; }
  .store.plain .price-list { margin-top: 8px; }

  /* Compact store lists */
  .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 20px; overflow: hidden; margin-top: 14px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 12px 10px 12px 16px; border-top: 1px solid var(--rule); }
  .row:first-child { border-top: none; }
  .row .store-name { font-size: 16px; }
  .deal-count { flex: none; font-size: 14px; font-weight: 700; color: var(--raspberry); white-space: nowrap; }
  .deal-count.none { color: var(--muted); font-weight: 500; }

  /* Pick-and-mix offers found in the flyers */
  .flyers { margin-bottom: 18px; }
  .flyers h2 { margin-top: 0; }
  .flyer-source { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  .flyer-source a, .deal-meta a { color: inherit; text-underline-offset: 3px; }
  .flyers .deal:first-of-type { border-top: none; padding-top: 8px; }
  .flyers-none { color: var(--muted); font-size: 15px; margin: 0 0 22px; }
  .flyers-none a { color: inherit; text-underline-offset: 3px; }

  .empty { margin: 8px 0 0; max-width: 46ch; color: var(--muted); font-size: 16px; }
  .quiet { color: var(--muted); font-size: 15px; margin: 10px 0 0; max-width: 56ch; }
  #storeSearch { padding-block: 9px; }
  .spinner {
    display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: -1px;
    border: 2px solid var(--muted); border-right-color: transparent; border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Hero actions */
  .hero-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-top: 16px; }
  .hero-row .status { margin: 0; flex: 1 1 220px; }

  /* Sales: one card, a lemon price tag per sale. */
  .sales { padding-top: 6px; }
  .sales .deal:first-child { border-top: none; padding-top: 12px; }
  .deal-item { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  .deal-meta a { color: inherit; text-underline-offset: 3px; }

  /* The list */
  .add { position: relative; }
  .suggest { margin-top: 8px; }
  .suggest .row { width: 100%; border: none; border-top: 1px solid var(--rule); background: none; text-align: left; }
  .suggest .row:first-child { border-top: none; }
  .suggest .row:hover, .suggest .row:focus-visible { background: var(--surface-2); }
  .suggest .pprice { margin-left: auto; }
  .plus {
    flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
    background: var(--raspberry-soft); color: var(--raspberry); font: 600 18px/1 var(--display);
  }
  .item-kind {
    flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
    background: var(--surface-2); color: var(--muted); font: 600 13px/1 var(--display);
  }
  .item-sub { color: var(--muted); font-size: 14px; }
  .item-actions { flex: none; display: flex; align-items: center; gap: 6px; }
  .item-actions .chip { padding: 5px 11px; font-size: 13px; }
  .remove {
    flex: none; display: grid; place-items: center; width: 36px; height: 36px;
    border: none; background: none; border-radius: 50%; color: var(--muted); font-size: 18px;
  }
  .remove:hover { background: var(--surface-2); color: var(--ink); }

  @media (max-width: 560px) {
    .wrap { padding: 14px 16px 96px; }
    .hero { margin-top: 44px; }
    .tabs { margin-top: 44px; gap: 20px; }
    .store.featured { padding: 16px 16px 6px; border-radius: 20px; }
    .deal { gap: 12px; }
    .primary { padding: 12px 16px; }
    .row { flex-wrap: wrap; }
    .item-actions { margin-left: 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo g, .logo.busy g, .spinner { animation: none; }
    .primary { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo" id="logo" viewBox="0 0 32 32" aria-hidden="true">
        <g><rect x="3" y="13" width="11" height="11" rx="2.5" transform="rotate(45 8.5 18.5)" fill="var(--ink)"/></g>
        <g><circle cx="20.5" cy="11" r="6" fill="none" stroke="var(--raspberry)" stroke-width="4"/></g>
        <g><ellipse cx="22" cy="24" rx="5" ry="3.6" transform="rotate(-20 22 24)" fill="var(--lemon)"/></g>
      </svg>
      <span class="wordmark">Irtokarkki</span>
    </div>
    <div class="lang" role="group" aria-label="Kieli / Språk / Language">
      <button data-lang="fi" title="Suomi">FI</button>
      <button data-lang="sv" title="Svenska">SV</button>
      <button data-lang="en" title="English">EN</button>
    </div>
  </header>

  <section class="hero">
    <h1 id="headline" aria-live="polite"></h1>
    <div class="hero-row">
      <p class="status" id="status"></p>
      <button class="primary" id="refreshBtn" data-i18n="check"></button>
    </div>
  </section>

  <div id="errors"></div>

  <nav class="tabs">
    <button class="tab active" data-tab="sales"><span data-i18n="tabSales"></span> <span class="count" id="salesCount">0</span></button>
    <button class="tab" data-tab="list"><span data-i18n="tabList"></span> <span class="count" id="listCount">0</span></button>
    <button class="tab" data-tab="stores"><span data-i18n="tabStores"></span> <span class="count" id="favCount">0</span></button>
  </nav>

  <section id="salesView"></section>

  <section id="listView" hidden>
    <div class="add">
      <label class="field">
        <span class="plus" aria-hidden="true">+</span>
        <input type="text" id="addInput" data-i18n-placeholder="addPlaceholder" data-i18n-label="addPlaceholder" autocomplete="off" maxlength="60">
      </label>
      <div id="suggest"></div>
    </div>
    <p class="quiet" data-i18n="addHint"></p>
    <div id="listItems"></div>
  </section>

  <section id="storesView" hidden>
    <label class="field">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input type="text" id="storeSearch" data-i18n-placeholder="storeSearch" data-i18n-label="storeSearchLabel" autocomplete="off">
    </label>
    <div id="storesList"></div>
  </section>
</div>

    error: "Couldn't check everything: {e}",
    until: "Until {date}", openFlyer: "Open flyer",
    noStoresYet: "You haven't picked any stores yet. Star the stores you shop at in the Stores tab.",
    emptyList: "Your list is empty. Add products or words in the My list tab.",
    noneOnSale: "Nothing on your list is on sale {stores} right now.",
    inStores: "in your favourite stores",
    addPlaceholder: "Add a product or a word…",
    addWord: "Add the word “{w}”", addWordSub: "any product with it in its name",
    addHint: "Tip: type the start of a word: “irtokark” also finds “irtokarkit”. Pick a product from the results to add exactly that one.",
    tooShort: "Type at least 3 letters.",
    pickStoreToSearch: "Products are searched in your favourite store's range. Pick a store in the Stores tab.",
    noProducts: "No products found.", searching: "Searching…",
    any: "any brand", product: "exact product", flyers: "Also in flyers",
    flyersHint: "Also look in the flyers: for things not sold online, like pick-and-mix.",
    remove: "Remove", listTitle: "Your list", listEmpty: "The list is empty.",
    storeSearch: "Find any store by name or city, e.g. “Prisma Kaleva”", storeSearchLabel: "Search stores",
    addFav: "Add to favourites", removeFav: "Remove from favourites", map: "Map",
    noStoresFound: "No stores found.", favourites: "Favourites",
    favHint: "Find a store above and tap ☆. Your list is checked in your favourite stores.",
  },
};
const LOCALES = { fi: "fi-FI", sv: "sv-FI", en: "en-GB" };

const ICONS = {
  star: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17l-5.38 2.85 1.03-6L3.3 9.6l6-.9z"/></svg>`,
  pin: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`,
};

function detectLang() {
  try { const saved = localStorage.getItem("lang"); if (STRINGS[saved]) return saved; } catch {}
  for (const l of navigator.languages || [navigator.language]) {
    const code = (l || "").slice(0, 2).toLowerCase();
    if (STRINGS[code]) return code;
  }
  return "fi";
}
let lang = detectLang();

// t("key", {var: value}) → translated text with {var} filled in. Values are inserted as-is, so escape HTML first.
const t = (key, vars = {}) => STRINGS[lang][key].replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const euro = (n) => new Intl.NumberFormat(LOCALES[lang], { style: "currency", currency: "EUR" }).format(n);
const fmtDate = (iso) => iso ? new Intl.DateTimeFormat(LOCALES[lang]).format(new Date(iso + "T12:00")) : "";
const fmtDateTime = (iso) => new Intl.DateTimeFormat(LOCALES[lang], { dateStyle: "medium", timeStyle: "short" }).format(new Date(iso));

function setLang(code) {
  lang = code;
  try { localStorage.setItem("lang", code); } catch {}
  document.documentElement.lang = code;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll("[data-i18n-label]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nLabel)); });
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === code)));
  render();
  renderSuggest();
}

// Everything lives on the server, so it's the same on the phone and the computer.
let items = [];         // the shopping list
let stores = [];        // favourite stores
let sales = null;       // the latest check, from /api/sales
let checking = false;
let ready = false;      // list and stores loaded
let storeResults = null;
let productResults = null;  // {q, results} or null
const STORE_FIELDS = ["chain", "store_id", "name", "location", "map_url", "source", "location_sv"];

async function api(method, url, body) {
  const res = await fetch(url, {
    method, headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let msg = `${res.status} ${res.statusText}`;
    try { msg = (await res.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  return res.json();
}

let errorMessage = "";  // the last failed request; kept until a check succeeds
function showError(err) {
  errorMessage = err.message;
  render();
}

// Quick edits could start overlapping checks; only the latest one's answer counts.
let checkId = 0;
async function checkSales(refresh = false) {
  const id = ++checkId;
  checking = true;
  render();
  try {
    const result = await api("POST", "/api/sales", { refresh });
    if (id === checkId) { sales = result; errorMessage = ""; }
  } finally {
    if (id === checkId) { checking = false; render(); }
  }
}

// Saves go to the server one at a time, each with the newest list, so a quick add-then-remove can't arrive out of order.
let saving = Promise.resolve();
const latestSave = {};
function save(url, field, body, apply) {
  const seq = latestSave[url] = (latestSave[url] || 0) + 1;
  const run = async () => {
    const result = await api("PUT", url, body());
    if (seq === latestSave[url]) { apply(result[field]); render(); }  // an older answer must not undo a newer edit
  };
  saving = saving.then(run, run);
  return saving;  // no check after an edit: the page checks when opened and on "Check now"
}

function saveList(next) {
  items = next;
  render();
  return save("/api/list", "items", () => ({ items }), (saved) => { items = saved; });
}

function saveStores(next) {
  stores = next;
  render();
  const body = () => ({ stores: stores.map((s) => Object.fromEntries(STORE_FIELDS.map((f) => [f, s[f] ?? ""]))) });
  return save("/api/favourites", "stores", body, (saved) => { stores = saved; });
}

// Favourites used to live in the browser. Move them to the server once.
async function moveOldFavourites() {
  let old = [];
  try { old = (JSON.parse(localStorage.getItem("favourites")) || []).filter((f) => f.source === "s_group"); } catch {}
  if (old.length && !stores.length) {
    stores = (await api("PUT", "/api/favourites", { stores: old })).stores;
  }
  try { localStorage.removeItem("favourites"); localStorage.removeItem("city"); localStorage.removeItem("favOnly"); } catch {}
}

// Sales of items removed since the last check aren't shown.
const itemLabel = (it) => (it.type === "word" ? it.text : it.name);
const saleList = () => ((sales && sales.sales) || []).filter((s) => items.some((it) => itemLabel(it) === s.item));

function headline() {
  if (!ready || (checking && !sales)) return t("heroChecking");
  if (!items.length) return t("heroEmptyList");
  const n = saleList().length;
  if (!n && !stores.length) return t("heroNoStores");
  if (!n) return t("heroNone");
  return n === 1 ? t("heroOne") : t("heroMany", { n });
}

function render() {
  $("headline").textContent = headline();
  $("logo").classList.toggle("busy", checking);
  $("status").textContent = checking ? t("checking") : sales && sales.checked_at ? t("updated", { time: fmtDateTime(sales.checked_at) }) : "";
  $("refreshBtn").disabled = checking || !ready;
  $("errors").innerHTML = ((sales && sales.errors) || []).map((e) => `<div class="error">${t("error", { e: esc(e) })}</div>`).join("")
    + (errorMessage ? `<div class="error">${esc(errorMessage)}</div>` : "");
  $("salesCount").textContent = saleList().length;
  $("listCount").textContent = items.length;
  $("favCount").innerHTML = `${stores.length}${ICONS.star}`;
  renderSales();
  renderList();
  renderStores();
}

function saleRow(s) {
  const label = s.item_type === "product" ? esc(s.item) : `${esc(s.item)}: ${esc(s.product)}`;
  const isFlyer = s.regular_price === null;
  const off = s.regular_price && s.price !== null ? Math.round(100 * (1 - s.price / s.regular_price)) : 0;
  const meta = isFlyer
    ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.place)} · ${t("openFlyer")}</a>`
    : `<span>${esc(s.place)}</span>${s.until ? `<span>${t("until", { date: fmtDate(s.until) })}</span>` : ""}`;
  return `
        <div class="deal">
          <div>
            <div class="deal-name">${label}</div>
            <div class="deal-meta">${meta}</div>
          </div>
          ${s.price === null ? "" : `
          <div class="price-tag">
            <div class="tag">
              ${s.regular_price ? `<span class="was">${euro(s.regular_price)}</span>` : ""}
              <span class="now">${euro(s.price)}</span>
            </div>
            ${off > 0 ? `<span class="off">−${off}%</span>` : ""}
          </div>`}
        </div>`;
}

function renderSales() {
  let html = "";
  if (!ready) html = "";
  else if (!items.length) html = `<p class="empty">${t("emptyList")}</p>`;
  else if (saleList().length) html = `<article class="store featured sales">${saleList().map(saleRow).join("")}</article>`;
  else if (sales && !checking && stores.length) html = `<p class="empty">${t("noneOnSale", { stores: t("inStores") })}</p>`;
  if (ready && !stores.length) html += `<p class="empty">${t("noStoresYet")}</p>`;
  $("salesView").innerHTML = html;
}

function renderList() {
  const rows = items.map((it, i) => `
      <div class="row">
        <span class="item-kind" aria-hidden="true">${it.type === "word" ? "Aa" : "#"}</span>
        <div class="store-info">
          <div class="store-name">${esc(it.type === "word" ? it.text : it.name)}</div>
          <div class="item-sub">${it.type === "word" ? t("any") : t("product")}</div>
        </div>
        <div class="item-actions">
          ${it.type === "word" ? `<button class="chip ${it.flyers ? "on" : ""}" data-flyers="${i}" aria-pressed="${!!it.flyers}" title="${t("flyersHint")}">${t("flyers")}</button>` : ""}
          <button class="remove" data-remove="${i}" title="${t("remove")}" aria-label="${t("remove")}">✕</button>
        </div>
      </div>`).join("");
  $("listItems").innerHTML = `<h2>${t("listTitle")} <span class="h-count">${items.length}</span></h2>` +
    (rows ? `<div class="panel">${rows}</div>` : `<p class="quiet">${t("listEmpty")}</p>`);
}

function renderSuggest() {
  const q = $("addInput").value.trim();
  if (!q) { $("suggest").innerHTML = ""; return; }
  const word = q.toLowerCase().replace(/\s+/g, " ");
  const wordRow = word.length >= 3
    ? `<button class="row" data-add-word="${esc(word)}"><span class="plus" aria-hidden="true">+</span>
         <div class="store-info"><div class="store-name">${t("addWord", { w: esc(word) })}</div><div class="item-sub">${t("addWordSub")}</div></div></button>`
    : `<div class="row"><div class="item-sub">${t("tooShort")}</div></div>`;
  let productRows = "";
  if (!stores.length) productRows = `<div class="row"><div class="item-sub">${t("pickStoreToSearch")}</div></div>`;
  else if (!productResults || productResults.q !== q) productRows = q.length >= 2 ? `<div class="row"><div class="item-sub"><span class="spinner"></span>${t("searching")}</div></div>` : "";
  else if (!productResults.results.length) productRows = `<div class="row"><div class="item-sub">${t("noProducts")}</div></div>`;
  else productRows = productResults.results.map((p, i) => `
      <button class="row" data-add-product="${i}"><span class="item-kind" aria-hidden="true">#</span>
        <div class="store-info"><div class="store-name">${esc(p.name)}</div></div>
        <span class="pprice">${euro(p.price)}</span></button>`).join("");
  $("suggest").innerHTML = `<div class="panel suggest">${wordRow}${productRows}</div>`;
}

function addItem(item) {
  $("addInput").value = "";
  productResults = null;
  renderSuggest();
  const exists = items.some((it) => it.type === item.type && (item.type === "word" ? it.text === item.text : it.ean === item.ean));
  if (!exists) saveList([...items, item]).catch(showError);
}

function mark(store) {
  return `<span class="mark ${esc(store.source)}" title="${esc(store.chain)}" aria-hidden="true">S</span>`;
}
const isFavourite = (key) => stores.some((s) => s.key === key);
function starButton(store) {
  const fav = isFavourite(store.key);
  const label = t(fav ? "removeFav" : "addFav");
  return `<button class="star ${fav ? "on" : ""}" data-key="${esc(store.key)}"
    title="${label}" aria-label="${label}" aria-pressed="${fav}">${ICONS.star}</button>`;
}
function storeLocation(store) {
  const text = esc((lang === "sv" && store.location_sv) || store.location || "");
  return store.map_url ? `<a href="${esc(store.map_url)}" target="_blank" rel="noopener">${ICONS.pin}${text || t("map")}</a>` : text;
}
function storeRow(store) {
  return `
    <div class="row">
      ${mark(store)}
      <div class="store-info">
        <div class="store-name">${esc(store.name)}</div>
        <div class="store-loc">${storeLocation(store)}</div>
      </div>
      ${starButton(store)}
    </div>`;
}

function renderStores() {
  if (storeResults) {
    const rows = storeResults.map(storeRow).join("");
    $("storesList").innerHTML = rows ? `<div class="panel">${rows}</div>` : `<p class="quiet">${t("noStoresFound")}</p>`;
    return;
  }
  $("storesList").innerHTML = `
    <h2>${t("favourites")} <span class="h-count">${stores.length}</span></h2>
    ${stores.length ? `<div class="panel">${stores.map(storeRow).join("")}</div>` : `<p class="quiet">${t("favHint")}</p>`}`;
}

function toggleFavourite(key) {
  if (isFavourite(key)) return saveStores(stores.filter((s) => s.key !== key));
  const store = (storeResults || []).find((s) => s.key === key);
  return store ? saveStores([...stores, store]) : Promise.resolve();
}

document.addEventListener("click", (e) => {
  const star = e.target.closest(".star");
  if (star) toggleFavourite(star.dataset.key).catch(showError);

  const langBtn = e.target.closest(".lang button");
  if (langBtn) setLang(langBtn.dataset.lang);

  const tab = e.target.closest(".tab");
  if (tab) {
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === tab));
    for (const name of ["sales", "list", "stores"]) $(`${name}View`).hidden = tab.dataset.tab !== name;
  }

  const remove = e.target.closest("[data-remove]");
  if (remove) saveList(items.filter((_, i) => i !== Number(remove.dataset.remove))).catch(showError);

  const flyers = e.target.closest("[data-flyers]");
  if (flyers) {
    const i = Number(flyers.dataset.flyers);
    saveList(items.map((it, j) => (j === i ? { ...it, flyers: !it.flyers } : it))).catch(showError);
  }

  const addWord = e.target.closest("[data-add-word]");
  if (addWord) addItem({ type: "word", text: addWord.dataset.addWord, flyers: false });

  const addProduct = e.target.closest("[data-add-product]");
  if (addProduct && productResults) {
    const p = productResults.results[Number(addProduct.dataset.addProduct)];
    if (p) addItem({ type: "product", ean: p.ean, name: p.name });
  }
});

$("refreshBtn").addEventListener("click", () => checkSales(true).catch(showError));

$("addInput").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const word = $("addInput").value.trim().toLowerCase().replace(/\s+/g, " ");
  if (word.length >= 3) addItem({ type: "word", text: word, flyers: false });
});

let productTimer;
$("addInput").addEventListener("input", () => {
  clearTimeout(productTimer);
  renderSuggest();
  const q = $("addInput").value.trim();
  if (q.length < 2 || !stores.length) return;
  productTimer = setTimeout(async () => {
    try {
      const results = await api("GET", `/api/products/search?q=${encodeURIComponent(q)}`);
      if ($("addInput").value.trim() === q) { productResults = { q, results }; renderSuggest(); }
    } catch (err) { showError(err); }
  }, 350);
});

let searchTimer;
$("storeSearch").addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = $("storeSearch").value.trim();
  if (q.length < 2) { storeResults = null; renderStores(); return; }
  searchTimer = setTimeout(async () => {
    $("storesList").innerHTML = `<p class="quiet"><span class="spinner"></span>${t("searching")}</p>`;
    try {
      const results = await api("GET", `/api/stores/search?q=${encodeURIComponent(q)}`);
      if ($("storeSearch").value.trim() === q) { storeResults = results; renderStores(); }
    } catch (err) { showError(err); }
  }, 350);
});

async function start() {
  const [list, favs] = await Promise.all([api("GET", "/api/list"), api("GET", "/api/favourites")]);
  items = list.items;
  stores = favs.stores;
  await moveOldFavourites();
  ready = true;
  render();
  await checkSales();
}

setLang(lang);
start().catch(showError);
</script>
</body>
</html>
