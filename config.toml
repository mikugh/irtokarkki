# Language for the command line output and notifications: "fi", "sv" or "en".
# (The web UI has its own language switch.)
language = "fi"

[stores]
# S-group stores in this city are checked.
city = "Turku"
max_stores_per_chain = 10

[stores.s_group]   # Prisma, S-market, Sale, Alepa, ABC
enabled = true
# Optional: check only these stores instead of searching by city.
# IDs are in the store URLs on s-kaupat.fi, e.g. "603212622" = S-market Halinen.
store_ids = []

[search]
# Words searched in each store's product catalog.
terms = ["irtokarkki", "irtokarkit", "irtomakeiset"]
# A product's name must contain one of these to count (case-insensitive).
# The stores' search is fuzzy and returns lots of unrelated candy, so this keeps
# results to actual irtokarkki products. (Avoid just "irto": it also matches
# e.g. "Irtokarvan poistaja", a pet-hair remover.) Add e.g. "makeissekoitus" or "karkkipussi"
# to include candy bags, or set to [] to accept everything the search returns.
name_keywords = ["irtokark", "irtomakeis", "irttari"]

[flyers]
# Pick-and-mix (the weighed bins) isn't sold online, so its sales only show up in the
# weekly flyers. Each S-group cooperative publishes its flyers in a library on
# view.sok-julkaisut.fi; this is the name in its address. "tok-ilmoitukset" is
# Turun Osuuskauppa (Turku area). Other cooperatives link to theirs from their own site.
enabled = true
library = "tok-ilmoitukset"
# An offer counts when its text contains one of these (case-insensitive, hyphens ignored).
keywords = ["irtomakeis", "irtokark", "irtonamu"]
cache_hours = 3   # the web UI checks the flyer list again after this

[web]
# The web UI caches each store's prices and shares them between everyone using it,
# so the stores' sites aren't asked again for every visitor.
cache_hours = 3            # prices older than this are fetched again
min_refresh_minutes = 15   # "Check for deals" only refetches prices older than this

[notify]
desktop = true
# When you have favourite stores (in favourites.json, see the README), only notify about deals in those.
only_favourites = true
# Phone notifications: install the ntfy app, subscribe to a hard-to-guess topic
# name and put it here. Leave empty to disable.
ntfy_topic = ""
